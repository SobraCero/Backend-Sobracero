<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-layout :: layout(~{::div.contenido-especifico})}">
<body>
    <div class="contenido-especifico">
        <h2 style="color: #0f172a; text-align: center; margin-bottom: 20px;">Confirmación de Reserva</h2>
        
        <p style="color: #334155; font-size: 16px; line-height: 1.5;" th:text="${mensajeRol}"></p>
        <p style="color: #334155; font-size: 16px; line-height: 1.5;">Donación: <strong th:text="${nombreDonacion}"></strong></p>
        <p style="color: #334155; font-size: 16px; line-height: 1.5;">El código de validación único es:</p>
        
        <div style="text-align: center; margin: 40px 0;">
            <span th:text="${codigoRetiro}" style="background-color: #f1f5f9; color: #0f172a; padding: 16px 32px; border-radius: 8px; font-weight: 900; font-size: 32px; letter-spacing: 4px; display: inline-block;">
                DON-000000
            </span>
        </div>
        
        <p style="color: #64748b; font-size: 14px;">Este código es estricto y obligatorio para concretar la entrega en la plataforma. Por favor respeta los horarios indicados.</p>
    </div>
</body>
</html>
