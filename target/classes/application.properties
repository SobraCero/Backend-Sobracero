spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# Base de Datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sobracero_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update

# Configuracion de MinIO
minio.url=${MINIO_URL:http://localhost:9000}
minio.access.name=${MINIO_ACCESS_NAME:adminminio}
minio.access.secret=${MINIO_ACCESS_SECRET:adminminiopassword}
minio.bucket.name=${MINIO_BUCKET_NAME:imagenes-sobracero}
minio.bucket.docs=${MINIO_BUCKET_DOCS:documentos-privados}

# Tamano maximo por archivo
spring.servlet.multipart.max-file-size=50MB
# Tamano maximo de toda la peticion
spring.servlet.multipart.max-request-size=50MB

# Configuracion de Correo (SMTP Gmail)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true