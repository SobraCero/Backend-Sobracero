<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-layout :: layout(~{::div.contenido-especifico})}">
<body>
    <div class="contenido-especifico">
        <h2 style="color: #0f172a; text-align: center; margin-bottom: 20px;">Recuperar Contraseña</h2>
        
        <p style="color: #334155; font-size: 16px; line-height: 1.5;">Hola,</p>
        <p style="color: #334155; font-size: 16px; line-height: 1.5;">Has solicitado restablecer tu contraseña en <strong>Sobra Cero</strong>.</p>
        <p style="color: #334155; font-size: 16px; line-height: 1.5;">Haz clic en el siguiente botón para crear una nueva contraseña:</p>
        
        <div style="text-align: center; margin: 40px 0;">
            <a th:href="${enlaceRecuperacion}" style="background-color: #047857; color: white; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; display: inline-block;">
                Restablecer mi Contraseña
            </a>
        </div>
        
        <p style="color: #64748b; font-size: 14px;">Este enlace expirará en 15 minutos.</p>
    </div>
</body>
</html>
