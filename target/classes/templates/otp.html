<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base-layout :: layout(~{::div.contenido-especifico})}">
<body>
    <div class="contenido-especifico">
        <h2 style="color: #0f172a; text-align: center; margin-bottom: 20px;">Verificación de Inicio de Sesión</h2>
        
        <p style="color: #334155; font-size: 16px; line-height: 1.5;">Hola,</p>
        <p style="color: #334155; font-size: 16px; line-height: 1.5;">Se ha solicitado iniciar sesión en <strong>Sobra Cero</strong> usando tu cuenta.</p>
        <p style="color: #334155; font-size: 16px; line-height: 1.5;">Tu código de un solo uso (OTP) es:</p>
        
        <div style="text-align: center; margin: 40px 0;">
            <span th:text="${otp}" style="background-color: #f1f5f9; color: #0f172a; padding: 16px 32px; border-radius: 8px; font-weight: 900; font-size: 32px; letter-spacing: 4px; display: inline-block;">
                000000
            </span>
        </div>
        
        <p style="color: #64748b; font-size: 14px;">Este código expirará en 5 minutos. Si no fuiste tú, puedes ignorar este correo.</p>
    </div>
</body>
</html>
